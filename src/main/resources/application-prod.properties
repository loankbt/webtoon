# Activate with SPRING_PROFILES_ACTIVE=prod
# Lets platforms that inject a $PORT env var (Render, Railway, Heroku, etc.) control the listen port.
server.port=${PORT:8080}

# Flyway migrations must run on startup in production.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Database configuration for production deployments.
# These values should be supplied by the hosting platform as environment variables.
# Aiven MySQL usually requires SSL/TLS, so we force SSL mode here.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=true&sslmode=verify-ca&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Optional: helpful during startup debugging.
logging.level.org.flywaydb=INFO

# Never expose DB/connection details on the health endpoint in production.
management.endpoint.health.show-details=never
